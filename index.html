<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>防塵マスク管理システム</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="wrap">

    <div class="card">

      <h1>防塵マスク管理システム</h1>

      <div class="form-grid">

        <div class="field">
          <label>名前</label>

          <select id="name">
            <option value="">選択してください</option>
            <option>比多岡</option>
            <option>石黒</option>
            <option>岳</option>
            <option>佃</option>
            <option>横家</option>
            <option>中川</option>
          </select>
        </div>

        <div class="field">
          <label>使用日</label>
          <input type="date" id="date">
        </div>

        <div class="field">
          <label>使用時間</label>

          <div class="time-inputs">

            <div class="time-field">
              <input type="number" id="hours" value="0" min="0">
              <span>時間</span>
            </div>

            <div class="time-field">
              <input type="number" id="minutes" value="0" min="0" max="59">
              <span>分</span>
            </div>

          </div>
        </div>

      </div>

      <div id="selected-user" class="selected-user">
        名前を選択すると個別表示されます。
      </div>

      <div class="status-grid">

        <div class="status-card">
          <p class="status-label">合計使用時間</p>
          <p id="total-time" class="status-value">0時間 0分</p>
        </div>

        <div class="status-card">
          <p class="status-label">残り使用時間</p>
          <p id="remaining-time" class="status-value">15時間 0分</p>
        </div>

      </div>

      <div class="progress-card">

        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div id="progress-label" class="progress-label">
          0%
        </div>

      </div>

      <div id="exchange-message" class="exchange-message">
        15時間に達しました。マスクを交換してください。
      </div>

      <div class="action-group">

        <button id="exchange-button" class="button exchange-button hidden">
          交換
        </button>

        <button id="add-button" class="button primary-button">
          登録
        </button>

      </div>

      <div class="history-section">

        <h2>使用履歴</h2>

        <div class="table-wrapper">

          <table>

            <tbody id="history-body">

              <tr>
                <td>まだ登録されていません</td>
              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>

  <script>

    const maxMinutes = 15 * 60;

    let records =
      JSON.parse(localStorage.getItem("maskRecords") || "[]");

    const nameInput =
      document.getElementById("name");

    const dateInput =
      document.getElementById("date");

    const hoursInput =
      document.getElementById("hours");

    const minutesInput =
      document.getElementById("minutes");

    const totalTime =
      document.getElementById("total-time");

    const remainingTime =
      document.getElementById("remaining-time");

    const progressFill =
      document.getElementById("progress-fill");

    const progressLabel =
      document.getElementById("progress-label");

    const historyBody =
      document.getElementById("history-body");

    const exchangeButton =
      document.getElementById("exchange-button");

    const exchangeMessage =
      document.getElementById("exchange-message");

    const selectedUser =
      document.getElementById("selected-user");

    const today = new Date()
      .toISOString()
      .split("T")[0];

    dateInput.value = today;

    function saveData() {

      localStorage.setItem(
        "maskRecords",
        JSON.stringify(records)
      );
    }

    function formatTime(totalMinutes) {

      const h =
        Math.floor(totalMinutes / 60);

      const m =
        totalMinutes % 60;

      return `${h}時間 ${m}分`;
    }

    function getUserRecords() {

      const name =
        nameInput.value;

      return records.filter(
        record => record.name === name
      );
    }

    function updateUI() {

      const selected =
        getUserRecords();

      const total =
        selected.reduce((sum, record) => {

          return sum +
            (record.hours * 60) +
            record.minutes;

        }, 0);

      const remain =
        Math.max(maxMinutes - total, 0);

      const progress =
        Math.min((total / maxMinutes) * 100, 100);

      totalTime.textContent =
        formatTime(total);

      remainingTime.textContent =
        formatTime(remain);

      progressFill.style.width =
        `${progress}%`;

      progressLabel.textContent =
        `${progress.toFixed(1)}%`;

      progressFill.className =
        "progress-fill";

      if (progress >= 100) {

        progressFill.classList.add("danger");

      } else if (progress >= 80) {

        progressFill.classList.add("warning");
      }

      if (total >= maxMinutes) {

        exchangeMessage.classList.add("visible");

        exchangeButton.classList.remove("hidden");

      } else {

        exchangeMessage.classList.remove("visible");

        exchangeButton.classList.add("hidden");
      }

      if (nameInput.value) {

        selectedUser.textContent =
          `${nameInput.value} さんの個別表示`;

      } else {

        selectedUser.textContent =
          "名前を選択すると個別表示されます。";
      }

      renderHistory();
    }

    function renderHistory() {

      const selected =
        getUserRecords();

      historyBody.innerHTML = "";

      if (selected.length === 0) {

        historyBody.innerHTML =
          `
          <tr>
            <td>
              まだ登録されていません
            </td>
          </tr>
          `;

        return;
      }

      selected.forEach(record => {

        const tr =
          document.createElement("tr");

        tr.innerHTML =
          `
          <td>${record.name}</td>
          <td>${record.date}</td>
          <td>${record.hours}時間 ${record.minutes}分</td>
          <td>
            <button
              class="delete-button"
              onclick="deleteRecord(${record.id})"
            >
              削除
            </button>
          </td>
          `;

        historyBody.appendChild(tr);

      });
    }

    function addRecord() {

      const name =
        nameInput.value;

      const date =
        dateInput.value;

      const hours =
        Number(hoursInput.value);

      const minutes =
        Number(minutesInput.value);

      if (!name) {

        alert("名前を選択してください");
        return;
      }

      if ((hours * 60 + minutes) <= 0) {

        alert("使用時間を入力してください");
        return;
      }

      records.push({

        id: Date.now(),
        name,
        date,
        hours,
        minutes

      });

      saveData();

      hoursInput.value = 0;
      minutesInput.value = 0;

      updateUI();
    }

    function deleteRecord(id) {

      records =
        records.filter(
          record => record.id !== id
        );

      saveData();

      updateUI();
    }

    function exchangeMask() {

      const name =
        nameInput.value;

      if (!name) return;

      records =
        records.filter(
          record => record.name !== name
        );

      saveData();

      updateUI();

      alert("交換しました");
    }

    document
      .getElementById("add-button")
      .addEventListener("click", addRecord);

    exchangeButton
      .addEventListener("click", exchangeMask);

    nameInput
      .addEventListener("change", updateUI);

    updateUI();

  </script>

</body>
</html>
