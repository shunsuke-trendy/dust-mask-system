<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>防塵マスク管理システム</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f7fb;
      font-family: "Hiragino Sans", "Noto Sans JP", sans-serif;
      color: #1e293b;
      font-size: 0.9rem;
    }

    .wrap {
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    .card {
      background: #ffffff;
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    h1 {
      margin: 0 0 24px;
      font-size: 1.4rem;
      line-height: 1.4;
      font-weight: 800;
      word-break: keep-all;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 22px;
    }

    .form-grid {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .field {
      display: flex;
      flex-direction: column;
    }

    .field label {
      margin-bottom: 8px;
      font-size: 16px;
      font-weight: 700;
    }

    .field input,
    .field select {
      width: 100%;
      height: 56px;
      border: 1px solid #d6dee8;
      border-radius: 16px;
      padding: 0 16px;
      font-size: 16px;
      background: white;
    }

    .field input:focus,
    .field select:focus {
      outline: none;
      border-color: #2563eb;
    }

    .time-inputs {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .time-field {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .time-field input {
      flex: 1;
    }

    .time-field span {
      width: 40px;
      font-weight: 700;
      color: #64748b;
    }

    .selected-user {
      margin-top: 20px;
      background: #eff6ff;
      border-radius: 16px;
      padding: 14px;
      font-size: 15px;
      font-weight: 700;
      line-height: 1.5;
    }

    .status-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-top: 20px;
    }

    .status-card {
      background: #ffffff;
      border: 1px solid #dbe4ee;
      border-radius: 18px;
      padding: 18px;
      text-align: center;
    }

    .status-label {
      margin: 0;
      color: #64748b;
      font-size: 14px;
    }

    .status-value {
      margin-top: 10px;
      font-size: 24px;
      font-weight: 800;
    }

    .progress-card {
      margin-top: 20px;
    }

    .progress-bar {
      width: 100%;
      height: 16px;
      background: #dbe4ee;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #2563eb;
      border-radius: 999px;
      transition: 0.3s;
      width: 0%;
    }

    .progress-fill.warning {
      background: #f59e0b;
    }

    .progress-fill.danger {
      background: #dc2626;
    }

    .progress-label {
      margin-top: 8px;
      text-align: right;
      font-weight: 700;
    }

    .exchange-message {
      display: none;
      margin-top: 18px;
      padding: 14px;
      background: #fef3c7;
      color: #92400e;
      border-radius: 16px;
      line-height: 1.5;
      font-weight: 700;
    }

    .exchange-message.visible {
      display: block;
    }

    .action-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 22px;
    }

    .button {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    .primary-button {
      background: #2563eb;
      color: white;
    }

    .exchange-button {
      background: #16a34a;
      color: white;
    }

    .hidden {
      display: none;
    }

    .history-section {
      margin-top: 32px;
    }

    .table-wrapper {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    table,
    thead,
    tbody,
    tr,
    td {
      display: block;
      width: 100%;
    }

    thead {
      display: none;
    }

    tr {
      background: white;
      border-radius: 18px;
      padding: 14px;
      border: 1px solid #dbe4ee;
      margin-bottom: 12px;
    }

    td {
      padding: 8px 0;
      font-size: 15px;
    }

    td::before {
      display: block;
      margin-bottom: 4px;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
    }

    td:nth-child(1)::before {
      content: "名前";
    }

    td:nth-child(2)::before {
      content: "使用日";
    }

    td:nth-child(3)::before {
      content: "使用時間";
    }

    td:nth-child(4)::before {
      content: "操作";
    }

    .delete-button {
      width: 100%;
      height: 42px;
      border: none;
      border-radius: 14px;
      background: #dc2626;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    @media (min-width: 768px) {

      .wrap {
        max-width: 900px;
      }

      .status-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
      }

      .time-inputs {
        flex-direction: row;
      }

      .action-group {
        flex-direction: row;
      }

      .button {
        width: 180px;
      }
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="card">

      <h1>防塵マスク管理システム</h1>

      <div class="form-grid">

        <div class="field">
          <label>名前</label>

          <select id="name">
            <option value="">選択してください</option>
            <option>比多岡</option>
            <option>石黒</option>
            <option>岳</option>
            <option>佃</option>
            <option>横家</option>
            <option>中川</option>
          </select>
        </div>

        <div class="field">
          <label>使用日</label>
          <input type="date" id="date">
        </div>

        <div class="field">
          <label>使用時間</label>

          <div class="time-inputs">

            <div class="time-field">
              <input type="number" id="hours" value="0" min="0">
              <span>時間</span>
            </div>

            <div class="time-field">
              <input type="number" id="minutes" value="0" min="0" max="59">
              <span>分</span>
            </div>

          </div>
        </div>

      </div>

      <div id="selected-user" class="selected-user">
        名前を選択すると個別表示されます。
      </div>

      <div class="status-grid">

        <div class="status-card">
          <p class="status-label">合計使用時間</p>
          <p id="total-time" class="status-value">0時間 0分</p>
        </div>

        <div class="status-card">
          <p class="status-label">残り使用時間</p>
          <p id="remaining-time" class="status-value">15時間 0分</p>
        </div>

      </div>

      <div class="progress-card">

        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill"></div>
        </div>

        <div id="progress-label" class="progress-label">
          0%
        </div>

      </div>

      <div id="exchange-message" class="exchange-message">
        15時間に達しました。マスクを交換してください。
      </div>

      <div class="action-group">

        <button id="exchange-button" class="button exchange-button hidden">
          交換
        </button>

        <button id="add-button" class="button primary-button">
          登録
        </button>

      </div>

      <div class="history-section">

        <h2>使用履歴</h2>

        <div class="table-wrapper">

          <table>

            <tbody id="history-body">

              <tr>
                <td>まだ登録されていません</td>
              </tr>

            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>

  <script>

    const maxMinutes = 15 * 60;

    let records =
      JSON.parse(localStorage.getItem("maskRecords") || "[]");

    const nameInput =
      document.getElementById("name");

    const dateInput =
      document.getElementById("date");

    const hoursInput =
      document.getElementById("hours");

    const minutesInput =
      document.getElementById("minutes");

    const totalTime =
      document.getElementById("total-time");

    const remainingTime =
      document.getElementById("remaining-time");

    const progressFill =
      document.getElementById("progress-fill");

    const progressLabel =
      document.getElementById("progress-label");

    const historyBody =
      document.getElementById("history-body");

    const exchangeButton =
      document.getElementById("exchange-button");

    const exchangeMessage =
      document.getElementById("exchange-message");

    const selectedUser =
      document.getElementById("selected-user");

    const today = new Date()
      .toISOString()
      .split("T")[0];

    dateInput.value = today;

    function saveData() {

      localStorage.setItem(
        "maskRecords",
        JSON.stringify(records)
      );
    }

    function formatTime(totalMinutes) {

      const h =
        Math.floor(totalMinutes / 60);

      const m =
        totalMinutes % 60;

      return `${h}時間 ${m}分`;
    }

    function getUserRecords() {

      const name =
        nameInput.value;

      return records.filter(
        record => record.name === name
      );
    }

    function updateUI() {

      const selected =
        getUserRecords();

      const total =
        selected.reduce((sum, record) => {

          return sum +
            (record.hours * 60) +
            record.minutes;

        }, 0);

      const remain =
        Math.max(maxMinutes - total, 0);

      const progress =
        Math.min((total / maxMinutes) * 100, 100);

      totalTime.textContent =
        formatTime(total);

      remainingTime.textContent =
        formatTime(remain);

      progressFill.style.width =
        `${progress}%`;

      progressLabel.textContent =
        `${progress.toFixed(1)}%`;

      progressFill.className =
        "progress-fill";

      if (progress >= 100) {

        progressFill.classList.add("danger");

      } else if (progress >= 80) {

        progressFill.classList.add("warning");
      }

      if (total >= maxMinutes) {

        exchangeMessage.classList.add("visible");

        exchangeButton.classList.remove("hidden");

      } else {

        exchangeMessage.classList.remove("visible");

        exchangeButton.classList.add("hidden");
      }

      if (nameInput.value) {

        selectedUser.textContent =
          `${nameInput.value} さんの個別表示`;

      } else {

        selectedUser.textContent =
          "名前を選択すると個別表示されます。";
      }

      renderHistory();
    }

    function renderHistory() {

      const selected =
        getUserRecords();

      historyBody.innerHTML = "";

      if (selected.length === 0) {

        historyBody.innerHTML =
          `
          <tr>
            <td>
              まだ登録されていません
            </td>
          </tr>
          `;

        return;
      }

      selected.forEach(record => {

        const tr =
          document.createElement("tr");

        tr.innerHTML =
          `
          <td>${record.name}</td>
          <td>${record.date}</td>
          <td>${record.hours}時間 ${record.minutes}分</td>
          <td>
            <button
              class="delete-button"
              onclick="deleteRecord(${record.id})"
            >
              削除
            </button>
          </td>
          `;

        historyBody.appendChild(tr);

      });
    }

    function addRecord() {

      const name =
        nameInput.value;

      const date =
        dateInput.value;

      const hours =
        Number(hoursInput.value);

      const minutes =
        Number(minutesInput.value);

      if (!name) {

        alert("名前を選択してください");
        return;
      }

      if ((hours * 60 + minutes) <= 0) {

        alert("使用時間を入力してください");
        return;
      }

      records.push({

        id: Date.now(),
        name,
        date,
        hours,
        minutes

      });

      saveData();

      hoursInput.value = 0;
      minutesInput.value = 0;

      updateUI();
    }

    function deleteRecord(id) {

      records =
        records.filter(
          record => record.id !== id
        );

      saveData();

      updateUI();
    }

    function exchangeMask() {

      const name =
        nameInput.value;

      if (!name) return;

      records =
        records.filter(
          record => record.name !== name
        );

      saveData();

      updateUI();

      alert("交換しました");
    }

    document
      .getElementById("add-button")
      .addEventListener("click", addRecord);

    exchangeButton
      .addEventListener("click", exchangeMask);

    nameInput
      .addEventListener("change", updateUI);

    updateUI();

  </script>

</body>
</html>
